name: Release desktop
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-build.txt
          npm ci
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - run: npm test
      - name: Build embedded engine
        run: python scripts/build-backend.py
      - name: Verify embedded conversion
        run: python scripts/test-embedded.py build/backend/grafbridge-backend.exe
      - name: Build desktop installers
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test packaged desktop
        shell: pwsh
        run: |
          $env:GRAFBRIDGE_SMOKE_TEST='1'
          $process=Start-Process -FilePath 'build/releases/win-unpacked/GrafBridge.exe' -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Desktop smoke test failed' }
          if (-not (Test-Path 'build/releases/win-unpacked/resources/app.asar')) { throw 'Missing app archive' }
      - name: SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem build/releases/*.exe | ForEach-Object {
            $hash=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding utf8 build/releases/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GrafBridge-Windows
          path: |
            build/releases/*.exe
            build/releases/SHA256SUMS.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/releases/*.exe
            build/releases/SHA256SUMS.txt
